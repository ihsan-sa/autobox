# io_uring for root only: 1 refuses io_uring_setup to any process without CAP_SYS_ADMIN that is not in
# kernel.io_uring_group (-1, no group). A ring whose own descriptor was registered (IORING_REGISTER_RING_FDS) and then
# closed shows nowhere in /proc, so a file it registered can hold a member's volume where cc-member-v2's inventory
# walk cannot see it; with no ring there is nothing to hide. Programs that try io_uring (libuv, tokio) get EPERM and
# fall back to their thread pools. install.sh --etc installs this into /etc/sysctl.d and applies it at once.
kernel.io_uring_disabled = 1
