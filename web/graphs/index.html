<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the box — tokens and vitals</title>
<link rel="stylesheet" href="/style.css">
<header>
  <h1>the box — tokens and vitals</h1>
  <p class="sub">Served on loopback by <code>cc-graphs</code>. Times are this browser's local time.</p>
</header>

<section class="card" id="tokens">
  <div class="head">
    <h2>Token spend over time</h2>
    <span class="now" id="tokens-now"></span>
  </div>
  <div class="ctl" id="tokens-ctl"></div>
  <div class="plot"><svg id="tokens-svg" viewBox="0 0 1000 320" role="img"
       aria-label="token spend over time, one line per group"></svg><div class="tip" id="tokens-tip"></div></div>
  <div class="legend" id="tokens-legend"></div>
  <div class="foot" id="tokens-foot"></div>
</section>

<section class="card" id="vitals">
  <div class="head">
    <h2>Box vitals</h2>
    <span class="now" id="vitals-now"></span>
  </div>
  <div class="ctl" id="vitals-ctl"></div>
  <div class="plot"><svg id="vitals-svg" viewBox="0 0 1000 320" role="img"
       aria-label="the box's vitals, every series as a percentage of its own capacity on one axis"></svg><div class="tip" id="vitals-tip"></div></div>
  <div class="legend" id="vitals-legend"></div>
  <div class="foot" id="vitals-foot"></div>
</section>

<script src="/app.js"></script>
