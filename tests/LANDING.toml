# the e2e files are what split.py would write from selftest.sh today
[[check]]
name = "e2e-in-sync"
run = 'python3 tests/e2e/split.py --check'
paths = ["tests/e2e/**", "tests/green.sh", "tests/selftest.sh"]
class = "static"
cap = 60
where = ["box", "laptop"]

# the demo-video skill's Blender helpers: kit cases in python3, scene cases inside blender -b (only the box has it)
[[check]]
name = "selfcheck-demo-video-blender"
run = 'PYTHONDONTWRITEBYTECODE=1 python3 skills/demo-video/blender/selfcheck.py'
paths = ["skills/demo-video/blender/**"]
class = "hermetic"
cap = 900
where = ["box"]
