run = 'PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile mail/*.py tests/slack_selfcheck.py tests/handoff_selfcheck.py tests/member_v2.py tests/member_broker.py tests/member_import.py'
paths = ["mail/**", "tests/handoff_selfcheck.py", "tests/member_broker.py", "tests/member_import.py", "tests/member_v2.py", "tests/slack_selfcheck.py"]
class = "static"
cap = 120
where = ["box", "laptop"]

# check.sh's jq pass over the JSON it ships
[[check]]
name = "json-manifests"
run = 'for f in slack/*.json config/claude-settings.json config/units.json config/claude-managed.json; do jq -e . "$f" >/dev/null || { echo "$f: not JSON"; exit 1; }; done'
paths = ["config/claude-managed.json", "config/claude-settings.json", "config/units.json", "slack/*.json"]
class = "static"
cap = 60
where = ["box", "laptop"]

# this manifest parses, and every reach.tsv edge is two tools under bin/ with no `cc` caller
[[check]]
name = "landing-data"
run = '''python3 -c 'import tomllib; tomllib.load(open("tests/LANDING.toml", "rb"))' && awk -F'\t' '/^#/ || NF == 0 { next } NF != 2 || $1 == "cc" || $1 == $2 { print FILENAME ": bad edge: " $0; bad = 1 } END { exit bad }' tests/reach.tsv && cut -f1,2 tests/reach.tsv | grep -v '^#' | tr '\t' '\n' | sort -u | while read -r t; do [ -z "$t" ] || [ -f "bin/$t" ] || { echo "tests/reach.tsv names $t, which is not under bin/"; exit 1; }; done'''
paths = ["tests/LANDING.toml", "tests/reach.tsv"]
class = "static"
cap = 30
where = ["box", "laptop"]

# ── the tools' own selfchecks (every bin/ tool check.sh's ships_selfcheck finds) ──

# The whole static gate, run as one host check because its agent-frontmatter, systemd-verify, phone-row
# and prefetch-window blocks cannot run alone (check.sh has no switch for one block). It owns only what
# no narrower check covers; it also runs every selfcheck, so it is the default set's wide net.
[[check]]
name = "check-sh"
run = 'tests/check.sh'
paths = [".githooks/**", "bin/cc", "bin/cc-notify", "config/claude-managed.json", "config/claude-settings.json", "config/systemd-user/**", "config/units.json", "slack/*.json", "templates/home/COMMS.md", "templates/home/RUNBOOK.md", "templates/home/USAGE.md", "templates/home/agents/**", "tests/check.sh", "tests/green.sh", "tests/quarantine", "tests/selftest.sh"]
class = "host"
cap = 2400
where = ["box", "laptop"]

[[check]]
name = "selfcheck-cc"
run = 'bin/cc selfcheck'
paths = ["bin/cc", "config/dispatch-prompt.md", "config/library-prompt.md", "config/mail-prompt.md", "config/raise-prompt.md", "config/spend-prompt.md", "config/writing-prompt.md", "slack/requirements.txt", "templates/home/CLAUDE.md"]
