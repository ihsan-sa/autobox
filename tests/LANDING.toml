# LANDING.toml — the checks the lander selects from, for this tree.
#
# ADD-ONLY. A check is never removed, never renamed and never narrowed (fewer paths, a class moved from host or box
# toward hermetic, a `where` taken away). The lander reads this file from the BASE of a change, so a head can only
# widen it; the lander's static `manifest-widen` check (not written yet) is to refuse a head that narrows it.
# To retire a check, add its replacement first and take the old one out through the lander's own self-change path,
# never in an ordinary PR.
#
# Every path here is relative to the tree this file sits in (bin/…, not core/bin/…), the way tests/gate-first is:
# this tree ships on its own. `*` stays inside one path segment, `**` crosses them. `run` is a /bin/sh command line
# run from this tree's root. A check also owns its own `run` file and its `fixtures`.
#
# class: static   reads files only — no process state, no ~/.cc, no tmux; runs on every change it owns
#        hermetic proven to pass in the lander's sandbox (none yet: each moves here only after that proof)
#        host     today's run: on the host, env scrubbed, serial per repo, before the merge. The day-one class of
#                 every selfcheck and every e2e stanza, because none is proven hermetic yet
#        box      needs the live machine; runs on main's tip after merges and gates the deploy
#        timing   races the clock; runs before the merge only while the box is idle
# cap is seconds. where lists the runners allowed, in order. mounts (default []) are read-only binds a sandboxed run
# needs, net (default false) says whether it may reach the network, fixtures (default []) are files the check reads
# beyond its run file. A static, hermetic or host check that names "laptop" goes there while the box is busy (a host
# one with a tmux `main` and a waiting claude of the job's own, lander/run.py HOST_PREP); a host check that needs this
# host itself — its kernel, a working bwrap, a venv or tool only the box has, where a case would be skipped and pass —
# keeps where = ["box"].
#
# Written by hand for the first cut from tests/check.sh's own discovery (ships_selfcheck) and tests/selftest.sh's
# STANZA_TOOLS scan; tests/e2e/README.md has the table of every check and why it has its class.

# ── static: one shellcheck or py_compile per file, and check.sh's data passes ──

[[check]]
name = "shellcheck-box-status"
run = 'bash -n bin/box-status && shellcheck -S warning -e SC1090,SC1010 bin/box-status'
paths = ["bin/box-status"]
class = "static"
cap = 120
where = ["box", "laptop"]

