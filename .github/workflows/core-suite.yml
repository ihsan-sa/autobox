# The core suite on GitHub's free standard runners, so a suite stops loading the box it tests.
#
# WHERE THIS RUNS: in the public repo core/ publishes to. This file lives at core/.github/ in the private repo, so
# cc-publish carries it with the rest of core/ and it lands at .github/ in the public one — where core/ is the root,
# which is why the paths below have no core/ in front. In the private repo it sits below the root and GitHub never
# reads it. Public repos run standard runners free; nothing here asks for a larger runner or reads a secret.
#
# WHAT RUNS: the `portable` half of tests/check.sh and tests/selftest.sh (CC_SUITE_PART, tests/green.sh) — the
# same files, cases and order the box runs, with nothing copied. A unit that needs the box itself (its systemd, its
# ~/.cc, its long-lived tmux server) declares itself `box`, and this run names it as left to the box instead of
# going red on it. Each suite ends by proving every unit it owns ran here or was left there by name.
#
# READING IT: the Actions tab, or `gh run list -R <owner>/autobox -w "core suite"`. A green run names the commit it
# passed on; the run's own duration is the minutes it took.
name: core suite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read      # it reads the tree and nothing else: no token, nothing written anywhere

concurrency:
  group: core-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: what this runner has
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck jq tmux bubblewrap
          # Ubuntu 24.04 stops unprivileged user namespaces through AppArmor, and bwrap needs one. This is the
          # throwaway runner's own kernel setting, gone with the runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          git config --global user.name "core suite"; git config --global user.email "core-suite@localhost"
          for c in bash python3 git jq shellcheck tmux bwrap; do printf '%s: %s\n' "$c" "$(command -v "$c" || echo MISSING)"; done
          bash --version | head -1; python3 --version; nproc

      # One step per suite, so the log says which one went red without reading the whole run.
      - name: tests/check.sh (portable half)
        run: CC_SUITE_PART=portable tests/check.sh

      - name: tests/selftest.sh (portable half)
        run: CC_SUITE_PART=portable tests/selftest.sh
