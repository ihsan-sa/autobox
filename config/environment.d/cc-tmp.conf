# The box's scratch lives on disk, not on /tmp. /tmp here can be a small tmpfs with a per-user quota, and the box's
# own tools and gates filled it until it killed a landing. install.sh links this into ~/.config/environment.d, so the
# user manager hands it to every unit it starts and every session tmux-main starts after that. cc-land sets the same
# path for itself (use_scratch), whatever it inherited. cc-tmp-reap reaps whatever TMPDIR names.
TMPDIR=${HOME}/.cc/tmp
