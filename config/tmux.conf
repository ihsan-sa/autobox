# ~/.tmux.conf — autobox defaults
set -g mouse on
set -g history-limit 50000
set -s escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g renumber-windows on
setw -g automatic-rename off
set -g allow-rename off
# A crash costs a restart, not the work: cc-tmux-ledger records what is running, and the next server's watcher starts
# cc-recover, which relaunches the sessions. `cc-tmux-ledger list` and `restore` are for the windows left over.
# It writes for the default socket only, so a fixture server reading this file keeps no ledger.
set-hook -g after-new-window 'run-shell -b "~/bin/cc-tmux-ledger save >/dev/null 2>&1"'
run-shell -b "~/bin/cc-tmux-ledger watch >/dev/null 2>&1"
set -g status-right "#H  %Y-%m-%d %H:%M"
